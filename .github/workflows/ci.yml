name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with: {path: .fastembed, key: fastembed-bge-small-en-v1.5}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests eval
      - name: Unit tests
        run: pytest -q
      - name: Build index
        run: python -m coverwise.ingest
      - name: Eval gate (retrieval recall + guardrail accuracy)
        run: python eval/run_eval.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-results, path: eval/results.json}

  container-k8s-dotnet:
    needs: test-and-eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t coverwise:latest .
      - name: Container smoke test
        run: |
          docker run -d --name cw -p 8080:8080 coverwise:latest
          for i in $(seq 1 30); do curl -fs localhost:8080/readyz && break; sleep 2; done
          curl -fs localhost:8080/readyz
          # Guardrail path works without an LLM key:
          curl -fs -X POST localhost:8080/ask -H 'content-type: application/json' \
               -d '{"question":"Write a poem about the sea"}' | tee /dev/stderr | grep -q '"intent":"off_topic"'

      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - name: .NET Semantic Kernel client calls the service
        working-directory: clients/dotnet/CoverWise.SkClient
        env: {COVERWISE_URL: "http://localhost:8080"}
        run: dotnet run -- "Should I take aspirin before my X-ray?"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with: {cluster_name: coverwise}
      - name: Deploy to Kubernetes and smoke test
        run: |
          kind load docker-image coverwise:latest --name coverwise
          kubectl apply -f k8s/coverwise.yaml
          kubectl rollout status deployment/coverwise --timeout=180s
          kubectl port-forward service/coverwise 9090:80 &
          for i in $(seq 1 15); do curl -fs localhost:9090/readyz && break; sleep 2; done
          curl -fs localhost:9090/metrics | grep -q coverwise_requests_total
