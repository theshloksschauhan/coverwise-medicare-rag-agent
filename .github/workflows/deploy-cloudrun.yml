name: Deploy to Cloud Run

# Runs after CI passes on main, or manually. Needs repository variables GCP_PROJECT_ID and GCP_REGION,
# and secret GCP_SA_KEY (service account JSON). The LLM key lives in Secret Manager as "coverwise-llm-key".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/coverwise/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: {credentials_json: "${{ secrets.GCP_SA_KEY }}"}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy
        run: |
          gcloud run deploy coverwise --image "$IMAGE" --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated --memory 2Gi --cpu 1 --min-instances 0 --max-instances 3 \
            --set-secrets LLM_API_KEY=coverwise-llm-key:latest
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe coverwise --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          curl -fs "$URL/readyz"
