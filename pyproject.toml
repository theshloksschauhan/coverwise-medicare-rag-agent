[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverwise"
version = "0.1.0"
description = "Cited, guard-railed Medicare coverage Q&A agent (RAG + LangGraph)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "langgraph>=0.2",
  "chromadb>=0.5",
  "fastembed>=0.3",
  "rank-bm25>=0.2.2",
  "openai>=1.40",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "beautifulsoup4>=4.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]
